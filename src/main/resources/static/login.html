<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/login.css">
</head>
<body>
    <div class="page-wrapper">
        <div id="background1">
            <span  class="welcome">Welcome Back!</span>
            <div class="login">
                <span class="login-text">Login into your account</span>
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-row">
                    <input type="email" id="email" placeholder="xico@email.com">
                    <button type="button" class="icon-btn" aria-label="Email">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="white" stroke-width="2">
                            <path d="M4 4h16v16H4z" stroke-linejoin="round"/>
                            <path d="M4 4l8 8 8-8" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>
            </div>

            <span class="password-text">Password</span>
            <div class="input-row">
                <input type="password" id="password" placeholder="Enter your password">
                <button type="button" class="icon-btn" aria-label="Toggle password">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="white" stroke-width="2">
                        <rect x="5" y="11" width="14" height="9" rx="2"/>
                        <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
                    </svg>
                </button>
            </div>
            <div class="forgot-password">
                <span class="forgot-password-text">Forgot Password?</span> <!--switch to a ref-->
            </div>
        </div>

        <div id="background2">
            <div class="brand">
                <img src="./images/cooperariLogo.png" class="brand-logo">
                <span class="brand-text">Cooperari</span>
            </div>
            <img src="./images/BackGroundImage.png" class="background2Image">
        </div>
    </div>
</body>
</html>
